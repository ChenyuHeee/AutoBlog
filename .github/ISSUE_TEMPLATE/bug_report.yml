name: Bug report
description: Report a bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please provide enough info to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
      placeholder: "When I run ..., it ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "I expected ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps/config to reproduce.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets).
      render: shell
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Windows 11 / Ubuntu 24.04"
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.10.x / 3.11.x / 3.12.x"
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste the relevant parts of source/config.yaml (redact secrets).
      render: yaml
    validations:
      required: false
