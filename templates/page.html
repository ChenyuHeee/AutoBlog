{% extends "base.html" %}

{% block content %}
<article class="page">
  <header class="page__header">
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="page__summary">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="page__content">
    {{ page.content_html | safe }}
  </div>
</article>
{% endblock %}
