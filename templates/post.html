{% extends "base.html" %}

{% block content %}
<article class="post">
  <header>
    <h1>{{ post.title }}</h1>
    <p class="post-meta">{{ post.date.strftime("%B %d, %Y") }}</p>
  </header>
  <div class="post-content">
    {{ post.content_html | safe }}
  </div>
  <p class="post-back"><a href="{{ url_for(trailing_slash=True) }}">&larr; Back to all articles</a></p>
</article>
{% endblock %}
