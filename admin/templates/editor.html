{% extends "base.html" %}
{% block content %}
  <div class="page-head">
    <div>
      <h1 class="h1">编辑</h1>
      <p class="muted">文件：<span class="mono">{{ path }}</span></p>
    </div>
    <div class="actions">
      <a class="btn btn--ghost" href="/content">返回列表</a>
    </div>
  </div>

  <form method="post" action="/edit" class="editor" data-editor-root>
    <input type="hidden" name="path" value="{{ path }}" />

    <div class="editor__pane">
      <label class="label" for="content">内容</label>
      <textarea class="textarea textarea--code" id="content" name="content" spellcheck="false" data-editor-textarea>{{ content }}</textarea>
      <div class="actions">
        <button class="btn" type="submit">保存</button>
        {% if is_markdown %}
          <button class="btn btn--ghost" type="button" data-render-preview>刷新预览</button>
        {% endif %}
      </div>
    </div>

    <div class="editor__pane">
      <label class="label">预览{% if not is_markdown %}（仅 Markdown 支持）{% endif %}</label>
      <div class="preview" data-preview-host>
        {% if is_markdown %}
          {{ preview_html | safe }}
        {% else %}
          <p class="muted">该文件类型不做渲染预览。</p>
        {% endif %}
      </div>
    </div>
  </form>
{% endblock %}
