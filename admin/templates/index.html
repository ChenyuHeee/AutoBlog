{% extends "base.html" %}

  <div class="grid">
    <a class="card" href="/config">
      <h2 class="h2">配置</h2>
      <p>编辑 source/config.yaml</p>
    </a>
    <a class="card" href="/content">

      <p>编辑文章与页面（Markdown 预览）</p>

      <h2 class="h2">主题</h2>

    <a class="card" href="/build">
      <h2 class="h2">构建</h2>
      <p>生成 public/ 并在 /preview/ 预览</p>
    </a>
