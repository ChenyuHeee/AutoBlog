background_music:
  enabled: true
  src: media/日落.mp3
  title: "日落"
  artist: "孙燕姿"
  cover: media/cover.jpg
  autoplay: false
  start_muted: true

ai_summary:
  provider: deepseek
  api_key: ""  # 推荐使用环境变量 DEEPSEEK_API_KEY，而不是把 key 写进文件
  model: deepseek-chat
  endpoint: https:  #api.deepseek.com/v1/chat/completions
  temperature: 0.2
  max_input_chars: 6000
  max_tokens: 200
  max_output_chars: 120
